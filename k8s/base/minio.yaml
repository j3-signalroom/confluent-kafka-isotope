# MinIO — S3-compatible object store for CMF artifact (JAR) storage.
#
# WHY THIS EXISTS
# Confluent Manager for Apache Flink (CMF) 2.4.0+ stores uploaded Flink
# artifacts (the PTF/UDF shadow JAR) in blob storage and references them from
# `CREATE FUNCTION ... USING JAR 'cmf://<artifact-id>'`. CMF supports S3, GCS,
# Azure Blob, or any S3-compatible store. On Minikube there is no cloud bucket,
# so we run MinIO (S3-compatible) in-cluster and point CMF's
# `cmf.artifacts.basePath` at an `s3://` path backed by it.
#
# Two consumers use these credentials:
#   1. CMF itself — for artifact upload/download/delete (helm `cmf.artifacts.configuration`).
#   2. The compute-pool Flink clusters — to pull the `cmf://` JAR at function
#      registration time (S3 filesystem config in the ComputePool clusterSpec).
#
# Credentials are intentionally static/demo-grade — this is a local Minikube
# stack, not a shared environment.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: confluent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  # Minikube ships a default 'standard' StorageClass (hostpath provisioner);
  # leaving storageClassName unset uses it. A PVC (not emptyDir) so an uploaded
  # artifact survives a MinIO pod restart — otherwise CMF's cmf:// reference
  # would dangle.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: confluent
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate          # single RWO PVC — never run two pods at once
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-08T15-41-24Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin123"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: confluent
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: s3            # S3 API — CMF + Flink talk to http://minio.confluent.svc:9000
      port: 9000
      targetPort: 9000
    - name: console       # web console (optional; reach via port-forward)
      port: 9001
      targetPort: 9001
---
# One-shot bucket creation. Waits for MinIO to answer, sets an `mc` alias, and
# creates the `cmf-artifacts` bucket (idempotent — `--ignore-existing`). Runs to
# Completion; `make minio-up` waits on this Job's completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-make-bucket
  namespace: confluent
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-08T15-39-49Z
          command:
            - sh
            - -c
            - |
              until mc alias set local http://minio.confluent.svc:9000 minioadmin minioadmin123; do
                echo "waiting for minio..."; sleep 3;
              done
              mc mb --ignore-existing local/cmf-artifacts
              echo "bucket cmf-artifacts ready"
