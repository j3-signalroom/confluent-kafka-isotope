# Helm values for CMF 2.4.x — enables the features required to run the isotope
# reports as first-class CMF Statements (visible in CMF + Control Center):
#
#   * cmf.artifacts.*             — upload the PTF shadow JAR as a cmf:// artifact,
#                                   backed by the in-cluster RustFS S3 store.
#   * cmf.sql.environmentCatalog  — writable per-environment catalog so DDL
#                                   (CREATE TABLE/VIEW) persists across statements
#                                   and CREATE FUNCTION ... USING JAR works (2.4.0+).
#
# NOTE: the S3 endpoint + credentials below MUST match k8s/base/rustfs.yaml
# (RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY) and the Makefile RUSTFS_* / CMF_ARTIFACT_*
# defaults. They are static demo values for a local minikube stack only.
cmf:
  sql:
    # DEPRECATED alias for encryption.enabled; kept false for the demo (no secret
    # encryption). Matches the prior --set cmf.sql.production=false.
    production: false
    environmentCatalog:
      enabled: true
  artifacts:
    enabled: true
    # s3://<bucket>/<prefix> — where CMF stores uploaded artifact JARs.
    basePath: s3://cmf-artifacts/cmf
    maxUploadSize: 100MB
    # Flink filesystem config CMF uses for upload/download/delete against RustFS.
    configuration:
      s3.endpoint: http://rustfs.confluent.svc:9000
      s3.path.style.access: "true"
      s3.access-key: rustfsadmin
      s3.secret-key: rustfsadmin123
