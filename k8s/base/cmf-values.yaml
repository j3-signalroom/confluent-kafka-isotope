# Helm values for CMF 2.5.x — enables the features required to run the isotope
# reports as first-class CMF Statements (visible in CMF + Control Center):
#
#   * cmf.artifacts.*             — upload the PTF shadow JAR as a cmf:// artifact,
#                                   backed by the in-cluster RustFS S3 store.
#   * cmf.sql.environmentCatalog  — writable per-environment catalog so DDL
#                                   (CREATE TABLE/VIEW) persists across statements
#                                   and CREATE FUNCTION ... USING JAR works (2.4.0+).
#
# NOTE: the S3 endpoint + credentials below MUST match k8s/base/rustfs.yaml
# (RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY) and the Makefile RUSTFS_* / CMF_ARTIFACT_*
# defaults. They are static demo values for a local minikube stack only.
cmf:
  sql:
    # DEPRECATED alias for encryption.enabled; kept false for the demo (no secret
    # encryption). Matches the prior --set cmf.sql.production=false.
    production: false
    environmentCatalog:
      enabled: true
  # CMF 2.5 compiles SQL Statements in separate JVMs by default: two shared
  # compiler sidecars in the CMF pod (Flink 1.19 + 2.3, 2Gi each) and a
  # cmf-compile-worker pod (3Gi). The isotope reports deploy as a CMF
  # Application (IsotopeReportsJob), not Statements, so those 7Gi of memory
  # requests buy nothing here and left the reports TaskManager Pending
  # ("Insufficient memory") on minikube. Turn them off: with sharedCompilers: []
  # the cmf container compiles any Statement itself. Statements that use
  # cmf:// artifacts (CREATE FUNCTION ... USING JAR) need a worker, so raise
  # workers.count back to 1 if you move reports to Statements.
  statementService:
    sharedCompilers: []
    workers:
      count: 0
  artifacts:
    enabled: true
    # s3://<bucket>/<prefix> — where CMF stores uploaded artifact JARs.
    basePath: s3://cmf-artifacts/cmf
    maxUploadSize: 100MB
    # Flink filesystem config CMF uses for upload/download/delete against RustFS.
    configuration:
      s3.endpoint: http://rustfs.confluent.svc:9000
      s3.path.style.access: "true"
      s3.access-key: rustfsadmin
      s3.secret-key: rustfsadmin123

# CMF's chart default requests 1 CPU, and in CMF 2.5 any shared-compiler sidecar
# inherits that request (3 CPU for the default pod: cmf + 1.19 + 2.3 compilers),
# which left it Pending ("Insufficient cpu") on a 6-CPU minikube node. 500m keeps
# headroom even if the compilers are re-enabled; limits stay at the chart
# default (2 CPU).
resources:
  requests:
    cpu: 500m
