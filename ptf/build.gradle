plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
}

repositories {
    mavenCentral()
}

dependencies {
    // Flink table API is provided at runtime by the Flink runtime/SQL Client.
    // Compile against it, but never bundle it into the shaded jar.
    compileOnly libs.flink.table.api.java
    compileOnly libs.flink.table.common

    // Additional Flink APIs the IsotopeReportsJob application driver needs —
    // also provided by the cp-flink runtime, so compileOnly (never bundled).
    compileOnly libs.flink.table.api.java.bridge
    compileOnly libs.flink.streaming.java
    compileOnly libs.flink.clients

    // T-Digest is what we actually need bundled — it's not part of Flink.
    implementation libs.t.digest

    // Jackson, declared explicitly rather than leaned on transitively: MergeTrace
    // parses and re-emits the isotope JSON to substitute a derived merge trace ID
    // (see its class javadoc). kafka-isotope-core already pulls the same version
    // in for its own serialization, so this adds no weight to the shaded jar —
    // it just stops the compile from depending on another module's private graph.
    implementation libs.jackson.databind

    // The isotope wire format, shared with the services in app/ so the Flink
    // collector (IsotopeAppendHop) and IsotopeProducerInterceptor cannot drift.
    implementation('ai.signalroom:kafka-isotope-core:0.18.0') {
        // Not bundled into the shaded artifact — see kafka-clients below.
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
    }

    // Isotope declares `fromHeaders(org.apache.kafka.common.header.Headers)`.
    // The UDF never calls it, but the JVM resolves the descriptor when the
    // class is linked, so Headers must be present at RUNTIME, not just at
    // compile time. compileOnly was tried and fails on CCAF — its function
    // classloader does not expose kafka-clients, and the statement dies with
    //   "UDF invocation error: ... org.apache.kafka.common.header.Headers"
    // at first invocation, long after CREATE FUNCTION reported success.
    // So it is bundled, and relocated below so the copy inside this artifact
    // can never be confused with the runtime's own kafka-clients.
    // transitive = false: the compression codecs (zstd/lz4/snappy) and their
    // native payloads are pure weight here — nothing in the isotope path
    // touches them.
    implementation(libs.kafka.clients) { transitive = false }

    testImplementation libs.flink.table.api.java
    testImplementation libs.flink.table.common
    testImplementation libs.junit.jupiter
    testRuntimeOnly   libs.junit.platform.launcher
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Compile to Java-17 bytecode. CP-Flink (`cp-flink:2.1.2-cp1-java21`)
    // runs Java-17 bytecode without issue; CCAF rejects artifacts compiled
    // for Java versions > 17 ("artifact should be compiled with a Java
    // version <= 17"). Targeting 17 makes the same JAR portable to both.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(17)
}

tasks.named('test') {
    useJUnitPlatform()
}

// Bundle the report .fql files into the jar (under sql/) so IsotopeReportsJob
// reads them from the classpath. Copied from scripts/flink/sql/cp/ at build time
// — that directory stays the single source of truth for the report SQL.
def generatedSqlDir = layout.buildDirectory.dir('generated-sql-resources')
tasks.register('copyReportSql', Copy) {
    from(rootProject.file('scripts/flink/sql/cp')) {
        include '*.fql'
    }
    into generatedSqlDir.map { it.dir('sql') }
}
sourceSets.main.resources.srcDir(generatedSqlDir)
tasks.named('processResources') { dependsOn 'copyReportSql' }

// The shadow jar is what gets uploaded to the Flink session cluster
// (via init container or `make flink-reports-up`). It bundles t-digest
// and the LatencyPercentilesPTF + StuckTracePTF + TDigests classes;
// it excludes the (provided-by-Flink) flink-table-* dependencies.
shadowJar {
    archiveBaseName.set('isotope-flink-udf')
    archiveClassifier.set('')
    // Runnable as a CMF Application: IsotopeReportsJob is the entry point. The
    // jar doubles as the PTF UDF library (its classes are also loaded as UDFs).
    manifest {
        attributes 'Main-Class': 'ai.signalroom.kafka.isotope.flink.IsotopeReportsJob'
    }
    mergeServiceFiles()
    // kafka-isotope-core pulls in Jackson for the isotope JSON. Flink ships its
    // own (shaded) Jackson; relocating ours keeps the two from meeting.
    relocate 'com.fasterxml.jackson', 'ai.signalroom.shaded.jackson'
    // Same reasoning for kafka-clients, which is bundled only to satisfy the
    // Isotope.fromHeaders descriptor (see the dependency comment above). The
    // relocation rewrites Isotope's own reference too, so the UDF links against
    // the bundled copy and never touches the Flink connector's kafka-clients.
    relocate 'org.apache.kafka', 'ai.signalroom.shaded.kafka'
    // Ship only the two header interfaces the Isotope descriptor needs
    // (Headers, and Header which it extends Iterable over) — 1 KB rather than
    // the 4,000-class, 12 MB whole client. shadow's minimize() cannot do this
    // job: a type named only in a method descriptor is invisible to bytecode
    // reachability analysis, so minimize strips Headers and the artifact fails
    // exactly as it did with compileOnly.
    //
    // Only Isotope is ever loaded by the UDF. IsotopeContext, whose descriptors
    // do reach ConsumerRecord and Producer, is never touched — and class
    // loading is lazy, so its missing types cost nothing.
    ['clients', 'server', 'shaded'].each { exclude "org/apache/kafka/${it}/**" }
    ['acl', 'annotation', 'cache', 'compress', 'config', 'errors', 'feature',
     'internals', 'memory', 'message', 'metrics', 'network', 'protocol', 'quota',
     'record', 'replica', 'requests', 'resource', 'security', 'serialization',
     'telemetry', 'utils'].each { exclude "org/apache/kafka/common/${it}/**" }
    exclude 'org/apache/kafka/common/header/internals/**'
    exclude 'org/apache/kafka/common/*.class'
}
