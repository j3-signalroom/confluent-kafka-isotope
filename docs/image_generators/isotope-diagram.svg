<text x="20" y="128" text-anchor="start" font-size="32" fill="#5F5E5A">Stamp headers; emit markers + metrics</text>
<text x="1540" y="75" text-anchor="start" font-size="44" fill="#2C2C2A">Interpreter</text>
<text x="1540" y="128" text-anchor="start" font-size="32" fill="#5F5E5A">Reads headers + markers</text>
