<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1960" viewBox="0 0 2040 1960" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Confluent Kafka Isotope — collector and interpreter</title>
<desc>Four-stage order workflow stamps isotope headers; Flink SQL emits seven one-minute reports, plus an optional CCAF-only AI root-cause path that is off by default.</desc>
<rect x="0" y="0" width="2040" height="1960" fill="#F7F9FB"/>
<text x="20" y="75" text-anchor="start" font-size="44" fill="#2C2C2A">Collector</text>
<text x="20" y="128" text-anchor="start" font-size="32" fill="#5F5E5A">Stamp headers; emit markers + metrics</text>
<text x="1540" y="75" text-anchor="start" font-size="44" fill="#2C2C2A">Interpreter</text>
<text x="1540" y="128" text-anchor="start" font-size="32" fill="#5F5E5A">Reads headers + markers</text>
<rect x="50" y="215" width="435" height="165" rx="24" fill="#DEEBF7" stroke="#8AB6DE" stroke-width="2"/>
<text x="267" y="292" text-anchor="middle" font-size="40" fill="#1B5E9E">order-intake</text>
<text x="267" y="345" text-anchor="middle" font-size="34" fill="#2E7EBF">producer</text>
<rect x="50" y="430" width="435" height="165" rx="24" fill="#DEEBF7" stroke="#8AB6DE" stroke-width="2"/>
<text x="267" y="507" text-anchor="middle" font-size="40" fill="#1B5E9E">order-enrichment</text>
<text x="267" y="560" text-anchor="middle" font-size="34" fill="#2E7EBF">consume + produce</text>
<rect x="50" y="645" width="435" height="165" rx="24" fill="#DEEBF7" stroke="#8AB6DE" stroke-width="2"/>
<text x="267" y="722" text-anchor="middle" font-size="40" fill="#1B5E9E">order-fulfillment</text>
<text x="267" y="775" text-anchor="middle" font-size="34" fill="#2E7EBF">consume + produce</text>
<rect x="50" y="860" width="435" height="165" rx="24" fill="#DEEBF7" stroke="#8AB6DE" stroke-width="2"/>
<text x="267" y="937" text-anchor="middle" font-size="40" fill="#1B5E9E">shipping-notify</text>
<text x="267" y="990" text-anchor="middle" font-size="34" fill="#2E7EBF">terminal consumer</text>
<rect x="543" y="215" width="362" height="165" rx="24" fill="#E7E3F8" stroke="#8B7FD1" stroke-width="2"/>
<text x="724" y="292" text-anchor="middle" font-size="34" fill="#5B4BA8">orders.placed</text>
<text x="724" y="345" text-anchor="middle" font-size="34" fill="#5B4BA8">+ x-isotope</text>
<line x1="485" y1="297" x2="543" y2="297" stroke="#8A8A85" stroke-width="2"/>
<rect x="543" y="430" width="362" height="165" rx="24" fill="#E7E3F8" stroke="#8B7FD1" stroke-width="2"/>
<text x="724" y="507" text-anchor="middle" font-size="34" fill="#5B4BA8">orders.enriched</text>
<text x="724" y="560" text-anchor="middle" font-size="34" fill="#5B4BA8">+ x-isotope</text>
<line x1="485" y1="512" x2="543" y2="512" stroke="#8A8A85" stroke-width="2"/>
<rect x="543" y="645" width="362" height="165" rx="24" fill="#E7E3F8" stroke="#8B7FD1" stroke-width="2"/>
<text x="724" y="722" text-anchor="middle" font-size="34" fill="#5B4BA8">orders.fulfilled</text>
<text x="724" y="775" text-anchor="middle" font-size="34" fill="#5B4BA8">+ x-isotope</text>
<line x1="485" y1="727" x2="543" y2="727" stroke="#8A8A85" stroke-width="2"/>
<rect x="543" y="860" width="362" height="165" rx="24" fill="#FBE4EC" stroke="#C2537E" stroke-width="2"/>
<text x="724" y="937" text-anchor="middle" font-size="34" fill="#A83A63">consume_events</text>
<text x="724" y="990" text-anchor="middle" font-size="34" fill="#A83A63">edge markers</text>
<line x1="485" y1="942" x2="543" y2="942" stroke="#8A8A85" stroke-width="2" stroke-dasharray="14 12"/>
<line x1="905" y1="297" x2="1000" y2="558" stroke="#8A8A85" stroke-width="2"/>
<line x1="905" y1="512" x2="1000" y2="600" stroke="#8A8A85" stroke-width="2"/>
<line x1="905" y1="727" x2="1000" y2="662" stroke="#8A8A85" stroke-width="2"/>
<line x1="905" y1="905" x2="1000" y2="700" stroke="#8A8A85" stroke-width="2"/>
<path d="M50 297 H25 V1163 H40" fill="none" stroke="#8A8A85" stroke-width="2"/>
<polygon points="34,1153 56,1163 34,1173" fill="#8A8A85"/>
<text x="68" y="1082" text-anchor="start" font-size="30" fill="#5F5E5A">Micrometer</text>
<rect x="50" y="1105" width="435" height="125" rx="20" fill="#E4E8F0" stroke="#9AA3B5" stroke-width="2"/>
<text x="267" y="1160" text-anchor="middle" font-size="36" fill="#3B4354">Prometheus / Grafana</text>
<text x="267" y="1205" text-anchor="middle" font-size="30" fill="#5A6274">always-on metrics</text>
<rect x="1000" y="515" width="447" height="220" rx="24" fill="#DDF2E9" stroke="#4FAE8B" stroke-width="2"/>
<text x="1223" y="588" text-anchor="middle" font-size="42" fill="#146A50">Flink SQL</text>
<text x="1223" y="648" text-anchor="middle" font-size="34" fill="#1E7A5C" font-family="SF Mono, Menlo, Consolas, monospace">CAST(headers[…])</text>
<text x="1223" y="700" text-anchor="middle" font-size="34" fill="#1E7A5C" font-family="SF Mono, Menlo, Consolas, monospace">TUMBLE(1 minute)</text>
<line x1="1223" y1="735" x2="1223" y2="795" stroke="#8A8A85" stroke-width="2"/>
<rect x="1000" y="795" width="447" height="155" rx="20" fill="#E9E6DE" stroke="#A9A497" stroke-width="2"/>
<text x="1223" y="858" text-anchor="middle" font-size="34" fill="#44443F" font-family="SF Mono, Menlo, Consolas, monospace">isotope-flink-udf.jar</text>
<text x="1223" y="910" text-anchor="middle" font-size="34" fill="#5F5E5A">two PTFs</text>
<text x="1223" y="1000" text-anchor="middle" font-size="34" fill="#5F5E5A">One JAR · same DDL · CP or CCAF</text>
<rect x="1540" y="140" width="490" height="105" rx="20" fill="#FCEBD5" stroke="#E0A44E" stroke-width="2"/>
<text x="1785" y="205" text-anchor="middle" font-size="34" fill="#8F5A14" font-family="SF Mono, Menlo, Consolas, monospace">latency_1m</text>
<line x1="1447" y1="600" x2="1540" y2="192" stroke="#8A8A85" stroke-width="2"/>
<rect x="1540" y="260" width="490" height="105" rx="20" fill="#FCEBD5" stroke="#E0A44E" stroke-width="2"/>
<text x="1785" y="325" text-anchor="middle" font-size="34" fill="#8F5A14" font-family="SF Mono, Menlo, Consolas, monospace">topology_1m</text>
<line x1="1447" y1="600" x2="1540" y2="312" stroke="#8A8A85" stroke-width="2"/>
<rect x="1540" y="380" width="490" height="105" rx="20" fill="#FCEBD5" stroke="#E0A44E" stroke-width="2"/>
<text x="1785" y="445" text-anchor="middle" font-size="34" fill="#8F5A14" font-family="SF Mono, Menlo, Consolas, monospace">bipartite_topology_1m</text>
<line x1="1447" y1="605" x2="1540" y2="432" stroke="#8A8A85" stroke-width="2"/>
<rect x="1540" y="500" width="490" height="105" rx="20" fill="#FCEBD5" stroke="#E0A44E" stroke-width="2"/>
<text x="1785" y="565" text-anchor="middle" font-size="34" fill="#8F5A14" font-family="SF Mono, Menlo, Consolas, monospace">hop_distribution_1m</text>
<line x1="1447" y1="620" x2="1540" y2="552" stroke="#8A8A85" stroke-width="2"/>
<rect x="1540" y="620" width="490" height="105" rx="20" fill="#FCEBD5" stroke="#E0A44E" stroke-width="2"/>
<text x="1785" y="685" text-anchor="middle" font-size="34" fill="#8F5A14" font-family="SF Mono, Menlo, Consolas, monospace">coverage_1m</text>
<line x1="1447" y1="640" x2="1540" y2="672" stroke="#8A8A85" stroke-width="2"/>
<rect x="1540" y="740" width="490" height="105" rx="20" fill="#FCEBD5" stroke="#E0A44E" stroke-width="2"/>
<text x="1785" y="805" text-anchor="middle" font-size="34" fill="#8F5A14" font-family="SF Mono, Menlo, Consolas, monospace">stuck_trace_1m (PTF)</text>
<line x1="1447" y1="650" x2="1540" y2="792" stroke="#8A8A85" stroke-width="2"/>
<rect x="1540" y="860" width="490" height="105" rx="20" fill="#FCEBD5" stroke="#E0A44E" stroke-width="2"/>
<text x="1785" y="925" text-anchor="middle" font-size="34" fill="#8F5A14" font-family="SF Mono, Menlo, Consolas, monospace">latency_percentiles_1m</text>
<line x1="1447" y1="660" x2="1540" y2="912" stroke="#8A8A85" stroke-width="2"/>
<text x="2030" y="1022" text-anchor="end" font-size="34" fill="#5F5E5A">7 reports · CP + CCAF</text>
<text x="2030" y="1068" text-anchor="end" font-size="34" fill="#5F5E5A">percentiles is a PTF</text>
<line x1="1600" y1="965" x2="1600" y2="1110" stroke="#4FAE8B" stroke-width="2" stroke-dasharray="14 12"/>
<polygon points="1590,1104 1600,1126 1610,1104" fill="#4FAE8B"/>
<rect x="1540" y="1126" width="490" height="240" rx="20" fill="#E8F5EF" stroke="#4FAE8B" stroke-width="2" stroke-dasharray="16 12"/>
<text x="1785" y="1185" text-anchor="middle" font-size="34" fill="#146A50">AI Root-Cause Analysis</text>
<text x="1785" y="1236" text-anchor="middle" font-size="26" fill="#4A7F6C" font-family="SF Mono, Menlo, Consolas, monospace">CREATE MODEL + ML_PREDICT</text>
<text x="1785" y="1281" text-anchor="middle" font-size="26" fill="#4A7F6C" font-family="SF Mono, Menlo, Consolas, monospace">rca_findings_1m</text>
<text x="1785" y="1330" text-anchor="middle" font-size="28" fill="#4A7F6C">off by default</text>
<text x="505" y="1092" text-anchor="start" font-size="35" fill="#44443F">Four-stage order workflow; traces ride in headers.</text>
<text x="505" y="1142" text-anchor="start" font-size="35" fill="#44443F">shipping-notify can't append a header (no re-produce),</text>
<text x="505" y="1192" text-anchor="start" font-size="35" fill="#44443F">so it emits a consume-edge marker to its own topic.</text>
<text x="505" y="1242" text-anchor="start" font-size="35" fill="#44443F">The topology graph stays complete either way.</text>
<text x="505" y="1342" text-anchor="start" font-size="35" fill="#44443F">AI root-cause analysis is opt-in and CCAF-only: it</text>
<text x="505" y="1392" text-anchor="start" font-size="35" fill="#44443F">summarizes stuck and slow traces from the report</text>
<text x="505" y="1442" text-anchor="start" font-size="35" fill="#44443F">topics. Off by default; CP is unaffected either way.</text>
<rect x="20" y="1520" width="2000" height="400" rx="24" fill="#F0F2EF" stroke="#C9CDC9" stroke-width="2"/>
<rect x="45" y="1585" width="38" height="38" rx="8" fill="#DEEBF7" stroke="#8AB6DE" stroke-width="2"/>
<text x="103" y="1615" text-anchor="start" font-size="34" fill="#44443F">Service</text>
<rect x="700" y="1585" width="38" height="38" rx="8" fill="#E7E3F8" stroke="#8B7FD1" stroke-width="2"/>
<text x="758" y="1615" text-anchor="start" font-size="34" fill="#44443F">Event topic (x-isotope)</text>
<rect x="1420" y="1585" width="38" height="38" rx="8" fill="#FBE4EC" stroke="#C2537E" stroke-width="2"/>
<text x="1478" y="1615" text-anchor="start" font-size="34" fill="#44443F">Marker topic</text>
<rect x="45" y="1665" width="38" height="38" rx="8" fill="#DDF2E9" stroke="#4FAE8B" stroke-width="2"/>
<text x="103" y="1695" text-anchor="start" font-size="34" fill="#44443F">Flink interpreter</text>
<rect x="700" y="1665" width="38" height="38" rx="8" fill="#FCEBD5" stroke="#E0A44E" stroke-width="2"/>
<text x="758" y="1695" text-anchor="start" font-size="34" fill="#44443F">Report sink (1-min)</text>
<rect x="1420" y="1665" width="38" height="38" rx="8" fill="#E9E6DE" stroke="#A9A497" stroke-width="2"/>
<text x="1478" y="1695" text-anchor="start" font-size="34" fill="#44443F">Shadow JAR</text>
<rect x="45" y="1745" width="38" height="38" rx="8" fill="#E4E8F0" stroke="#9AA3B5" stroke-width="2"/>
<text x="103" y="1775" text-anchor="start" font-size="34" fill="#44443F">Metrics backend</text>
<line x1="700" y1="1764" x2="738" y2="1764" stroke="#8A8A85" stroke-width="3"/>
<text x="758" y="1775" text-anchor="start" font-size="34" fill="#44443F">Produce</text>
<line x1="1420" y1="1764" x2="1458" y2="1764" stroke="#8A8A85" stroke-width="3" stroke-dasharray="14 12"/>
<text x="1478" y="1775" text-anchor="start" font-size="34" fill="#44443F">Edge marker emit</text>
<rect x="45" y="1825" width="38" height="38" rx="8" fill="#E8F5EF" stroke="#4FAE8B" stroke-width="2" stroke-dasharray="8 6"/>
<text x="103" y="1855" text-anchor="start" font-size="34" fill="#44443F">Optional · off by default</text>
</svg>