<text x="1785" y="1236" text-anchor="middle" font-size="26" fill="#4A7F6C" font-family="SF Mono, Menlo, Consolas, monospace">CREATE MODEL + ML_PREDICT</text>
<text x="1785" y="1281" text-anchor="middle" font-size="26" fill="#4A7F6C" font-family="SF Mono, Menlo, Consolas, monospace">rca_findings_1m</text>
<text x="1785" y="1330" text-anchor="middle" font-size="28" fill="#4A7F6C">off by default</text>
<text x="1000" y="1055" text-anchor="start" font-size="30" fill="#44443F">Four-stage order workflow; traces</text>
<text x="1000" y="1093" text-anchor="start" font-size="30" fill="#44443F">ride in headers. shipping-notify</text>
<text x="1000" y="1131" text-anchor="start" font-size="30" fill="#44443F">can't append a header (no re-produce),</text>
<text x="1000" y="1169" text-anchor="start" font-size="30" fill="#44443F">so it emits a consume-edge marker</text>
<text x="1000" y="1207" text-anchor="start" font-size="30" fill="#44443F">to its own topic.</text>
<text x="1000" y="1283" text-anchor="start" font-size="30" fill="#44443F">Flink is a collector too:</text>
<text x="1000" y="1321" text-anchor="start" font-size="30" fill="#44443F">ISOTOPE_APPEND_HOP appends its</text>
<text x="1000" y="1359" text-anchor="start" font-size="30" fill="#44443F">own hop onto orders.flink_enriched,</text>
<text x="1000" y="1397" text-anchor="start" font-size="30" fill="#44443F">so Flink appears in the topology graph</text>
<text x="1000" y="1435" text-anchor="start" font-size="30" fill="#44443F">as a producer, not only a reader.</text>
<text x="1000" y="1511" text-anchor="start" font-size="30" fill="#44443F">A windowed merge cannot forward a</text>
<text x="1000" y="1549" text-anchor="start" font-size="30" fill="#44443F">trace — many parents — so</text>
<text x="1000" y="1587" text-anchor="start" font-size="30" fill="#44443F">ISOTOPE_MERGE_TRACE mints a fresh one</text>
<text x="1000" y="1625" text-anchor="start" font-size="30" fill="#44443F">and the parent edges go to their own</text>
<text x="1000" y="1663" text-anchor="start" font-size="30" fill="#44443F">topic. Opt-in, like AI root-cause</text>
<text x="1000" y="1701" text-anchor="start" font-size="30" fill="#44443F">analysis (which is CCAF-only).</text>
<text x="1000" y="1777" text-anchor="start" font-size="30" fill="#44443F">State provenance (CP only) versions</text>
<text x="1000" y="1815" text-anchor="start" font-size="30" fill="#44443F">each entity by content instead — no</text>
<text x="1000" y="1853" text-anchor="start" font-size="30" fill="#44443F">window to key on, and no hops: a</text>
<text x="1000" y="1891" text-anchor="start" font-size="30" fill="#44443F">revision is not a movement.</text>
