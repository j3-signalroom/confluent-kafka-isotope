<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="2370" viewBox="0 0 2040 2370" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Confluent Kafka Isotope — collectors and interpreter</title>
<desc>Four-stage order workflow stamps isotope headers; Flink SQL reads them to emit seven one-minute reports and also acts as a second collector, appending its own hop onto orders.flink_enriched. Three opt-in paths are off by default: fan-in (merge) provenance, where a windowed merge mints a fresh trace and writes its parent edges to their own topic; CP-only state-level provenance, which publishes a content-addressed version chain per entity instead of stamping hops; and a CCAF-only AI root-cause report.</desc>
