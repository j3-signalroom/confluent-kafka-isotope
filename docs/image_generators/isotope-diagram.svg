<text x="724" y="1405" text-anchor="middle" font-size="22" fill="#4A7F6C" font-family="SF Mono, Menlo, Consolas, monospace">orders.flink_batched</text>
<text x="724" y="1447" text-anchor="middle" font-size="22" fill="#4A7F6C" font-family="SF Mono, Menlo, Consolas, monospace">FRESH trace · 1 hop</text>
<text x="724" y="1489" text-anchor="middle" font-size="22" fill="#4A7F6C" font-family="SF Mono, Menlo, Consolas, monospace">isotope_merge_edge_markers</text>
<text x="724" y="1538" text-anchor="middle" font-size="28" fill="#4A7F6C">off by default</text>
<line x1="1000" y1="735" x2="931" y2="1695" stroke="#4FAE8B" stroke-width="2" stroke-dasharray="14 12"/>
<polygon points="935,1682 905,1695 935,1708" fill="#4FAE8B"/>
