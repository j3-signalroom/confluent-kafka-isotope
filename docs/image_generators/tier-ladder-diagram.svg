<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Five-tier observability question ladder</title>
<desc>32 observability questions the project can answer, sorted into 5 tiers of increasing difficulty, each with one example question. A dashed line, with a triangle pointing to each side, marks where the aggregates logs, metrics, and APM can produce run out and the collector-plus-interpreter pattern becomes necessary; per-trace identity, on the bottom rung, needs the isotope header at every tier.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/>
<rect x="80" y="40" width="520" height="74" rx="10" fill="#FBE7EF" stroke="#C25781" stroke-width="0.8"/>
<text x="100" y="66" text-anchor="start" font-size="15" fill="#A03A63">Harder</text>
<text x="580" y="66" text-anchor="end" font-size="15" fill="#A03A63">7 questions</text>
<text x="100" y="86" text-anchor="start" font-size="11.5" fill="#B04A72">forensic replay · compliance · cross-system</text>
<text x="100" y="105" text-anchor="start" font-size="11.5" fill="#B04A72" font-style="italic">“Reconstruct a full per-trace journey for an audit?”</text>
<rect x="80" y="124" width="520" height="74" rx="10" fill="#FBEBD6" stroke="#D9A44E" stroke-width="0.8"/>
<text x="100" y="150" text-anchor="start" font-size="15" fill="#8A5A12">Hard</text>
<text x="580" y="150" text-anchor="end" font-size="15" fill="#8A5A12">6 questions</text>
<text x="100" y="170" text-anchor="start" font-size="11.5" fill="#9C6A1E">tail latency · drift · correlation</text>
<text x="100" y="189" text-anchor="start" font-size="11.5" fill="#9C6A1E" font-style="italic">“What are p50 / p95 / p99 across the pipeline?”</text>
<rect x="80" y="208" width="520" height="74" rx="10" fill="#EAE7FA" stroke="#7E72CC" stroke-width="0.8"/>
<text x="100" y="234" text-anchor="start" font-size="15" fill="#4B3FA0">Medium</text>
<text x="580" y="234" text-anchor="end" font-size="15" fill="#4B3FA0">7 questions</text>
<text x="100" y="254" text-anchor="start" font-size="11.5" fill="#5B4BA8">cross-window deltas · anomalies</text>
<text x="100" y="273" text-anchor="start" font-size="11.5" fill="#5B4BA8" font-style="italic">“Which traces went in but never came out in 60s?”</text>
<polygon points="86,298.0 82.5,304 89.5,304" fill="#5F5E5A"/>
<text x="95" y="304" text-anchor="start" font-size="11.5" fill="#5F5E5A">needs the collector + interpreter</text>
<line x1="80" y1="316" x2="600" y2="316" stroke="#888780" stroke-width="1" stroke-dasharray="6 5"/>
<polygon points="86,334 82.5,328.0 89.5,328.0" fill="#5F5E5A"/>
<text x="95" y="334" text-anchor="start" font-size="11.5" fill="#5F5E5A">logs · metrics · APM aggregates reach about here — identity needs the header</text>
<rect x="80" y="354" width="520" height="74" rx="10" fill="#E4EFFB" stroke="#6C9BD2" stroke-width="0.8"/>
<text x="100" y="380" text-anchor="start" font-size="15" fill="#1B5E9E">Easy to Medium</text>
<text x="580" y="380" text-anchor="end" font-size="15" fill="#1B5E9E">6 questions</text>
<text x="100" y="400" text-anchor="start" font-size="11.5" fill="#2E7EBF">single per-minute aggregates</text>
<text x="100" y="419" text-anchor="start" font-size="11.5" fill="#2E7EBF" font-style="italic">“End-to-end latency over the last minute?”</text>
<rect x="80" y="438" width="520" height="74" rx="10" fill="#E3F3EA" stroke="#3E8E6E" stroke-width="0.8"/>
<text x="100" y="464" text-anchor="start" font-size="15" fill="#1B6B4F">Easy</text>
<text x="580" y="464" text-anchor="end" font-size="15" fill="#1B6B4F">6 questions</text>
<text x="100" y="484" text-anchor="start" font-size="11.5" fill="#2E7D5E">single-record · single-trace</text>
<text x="100" y="503" text-anchor="start" font-size="11.5" fill="#2E7D5E" font-style="italic">“Did my record get tagged, and how many hops?”</text>
<line x1="50" y1="512" x2="50" y2="46" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="80" y="519" width="14" height="14" rx="4" fill="#E3F3EA" stroke="#3E8E6E" stroke-width="0.8"/>
<rect x="100" y="519" width="14" height="14" rx="4" fill="#E4EFFB" stroke="#6C9BD2" stroke-width="0.8"/>
<rect x="120" y="519" width="14" height="14" rx="4" fill="#EAE7FA" stroke="#7E72CC" stroke-width="0.8"/>
<rect x="140" y="519" width="14" height="14" rx="4" fill="#FBEBD6" stroke="#D9A44E" stroke-width="0.8"/>
<rect x="160" y="519" width="14" height="14" rx="4" fill="#FBE7EF" stroke="#C25781" stroke-width="0.8"/>
<text x="194" y="530" text-anchor="start" font-size="11.5" fill="#5F5E5A">tier difficulty (easier to harder) · 32 questions, 5 tiers</text>
</svg>